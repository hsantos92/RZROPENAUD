[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rzropenaud-io"
version = "0.1.0"
description = "Linux CLI utility for Razer BlackShark V2 (Model RZ04-0323, VID 1532, PID 0529)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Hector", email = "hector@archlinux.local" }
]
keywords = ["razer", "blackshark", "audio", "sidetone", "hid", "linux"]
dependencies = [
    "hidapi>=0.14.0",
]

[project.scripts]
rzropenaud-io = "rzropenaud_io.cli:main"
rzropenaud-gui = "rzropenaud_io.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rzropenaud_io*"]
