<svg xmlns="http://www.w3.org/2000/svg" width="220" height="190" viewBox="0 0 220 190">
  <defs>
    <!-- Ambient Razer Green Glow -->
    <radialGradient id="greenGlow" cx="55%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#44D62C" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#44D62C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#44D62C" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Matte Black Earcup Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34383B"/>
      <stop offset="45%" stop-color="#1E2022"/>
      <stop offset="100%" stop-color="#0E0F10"/>
    </linearGradient>
    <!-- Metallic Yoke / Headband Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#252729"/>
      <stop offset="50%" stop-color="#4A4E52"/>
      <stop offset="100%" stop-color="#1C1D1F"/>
    </linearGradient>
    <!-- Neon Green Accent Gradient -->
    <linearGradient id="razerGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CE644"/>
      <stop offset="100%" stop-color="#2BB616"/>
    </linearGradient>
  </defs>

  <!-- Subtle ambient glow behind earcup -->
  <circle cx="118" cy="108" r="68" fill="url(#greenGlow)"/>

  <!-- Headband Top Arch (Perspective side-profile like Synapse screenshot) -->
  <path d="M 103 18 C 110 15 123 15 130 18 L 132 56 C 122 54 111 54 101 56 Z"
        fill="url(#metalGrad)" stroke="#3E4246" stroke-width="1.2"/>
  <!-- Headband Stitch / Padding Detail -->
  <path d="M 106 20 L 105 53 M 127 20 L 128 53" stroke="#151618" stroke-width="1.5" opacity="0.8"/>
  <rect x="103" y="51" width="27" height="8" rx="2" fill="#181A1B" stroke="#33363A" stroke-width="1"/>

  <!-- Aviation-Style Dual Wire Yoke Rods (BlackShark V2 signature feature) -->
  <path d="M 106 58 L 98 92" stroke="#585C60" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 127 58 L 135 92" stroke="#585C60" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Yoke Pivot Hinges -->
  <rect x="94" y="88" width="7" height="11" rx="2.5" fill="#2A2D30" stroke="#44D62C" stroke-width="0.9"/>
  <rect x="132" y="88" width="7" height="11" rx="2.5" fill="#2A2D30" stroke="#44D62C" stroke-width="0.9"/>

  <!-- Plush Memory Foam Ear Cushion (Back Layer) -->
  <ellipse cx="110" cy="108" rx="30" ry="38" fill="#121314" stroke="#26282B" stroke-width="1.5"/>

  <!-- Main Oval Earcup Housing -->
  <ellipse cx="118" cy="108" rx="28" ry="36" fill="url(#cupGrad)" stroke="#3A3E42" stroke-width="1.5"/>

  <!-- Inner Earcup Ring &Glowing Razer Green Ring -->
  <ellipse cx="120" cy="108" rx="20" ry="26" fill="#151719" stroke="#292C2F" stroke-width="1.2"/>
  <ellipse cx="121" cy="108" rx="13" ry="17" fill="#1B1E21" stroke="url(#razerGreen)" stroke-width="1.8" opacity="0.95"/>

  <!-- Center Tactile Volume Knob on Earcup (BlackShark V2 signature side dial) -->
  <circle cx="121" cy="108" r="7" fill="#25282C" stroke="#44D62C" stroke-width="1.2"/>
  <circle cx="121" cy="108" r="2.5" fill="#44D62C"/>

  <!-- Detachable Boom Microphone Arm extending to bottom-left -->
  <path d="M 104 136 Q 82 152 56 164" fill="none" stroke="#2D3134" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 104 136 Q 82 152 56 164" fill="none" stroke="#50555B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Microphone Foam Pop Filter Tip -->
  <g transform="translate(48, 166) rotate(-24)">
    <rect x="-12" y="-7" width="22" height="14" rx="7" fill="#16181A" stroke="#44D62C" stroke-width="1.2"/>
    <!-- Mesh texture lines on mic tip -->
    <line x1="-6" y1="-4" x2="-6" y2="4" stroke="#2E3236" stroke-width="1"/>
    <line x1="-1" y1="-5" x2="-1" y2="5" stroke="#2E3236" stroke-width="1"/>
    <line x1="4" y1="-4" x2="4" y2="4" stroke="#2E3236" stroke-width="1"/>
  </g>
</svg>
