<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44D62C"/>
      <stop offset="100%" stop-color="#289E16"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="24" y1="5" x2="24" y2="12" stroke="#44D62C" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="5" r="2.8" fill="#44D62C"/>
  <!-- Head chassis -->
  <rect x="10" y="12" width="28" height="24" rx="4" fill="#17191C" stroke="url(#robotGrad)" stroke-width="2.2"/>
  <!-- Ears / bolts -->
  <rect x="6" y="19" width="4" height="10" rx="1.5" fill="#44D62C"/>
  <rect x="38" y="19" width="4" height="10" rx="1.5" fill="#44D62C"/>
  <!-- Glowing LED visor / eyes -->
  <rect x="15" y="18" width="6" height="5" rx="1" fill="#44D62C"/>
  <rect x="27" y="18" width="6" height="5" rx="1" fill="#44D62C"/>
  <!-- Speaker grill mouth -->
  <line x1="16" y1="29" x2="32" y2="29" stroke="#44D62C" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="26" x2="18" y2="32" stroke="#289E16" stroke-width="1.5"/>
  <line x1="24" y1="26" x2="24" y2="32" stroke="#289E16" stroke-width="1.5"/>
  <line x1="30" y1="26" x2="30" y2="32" stroke="#289E16" stroke-width="1.5"/>
</svg>
